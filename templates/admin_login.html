<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Fares Hamid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#0563bb' } } } }
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-blue-100 text-primary rounded-full flex items-center justify-center text-2xl mx-auto">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Admin Login</h1>
      <p class="text-gray-500 text-sm">Log in to manage projects & thoughts</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="p-3 rounded-lg text-sm font-semibold bg-red-100 text-red-700 text-center">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/admin/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
        <input type="email" name="email" value="faresexpress2@gmail.com" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
        Log In
      </button>
    </form>

    <div class="text-center">
      <a href="/" class="text-xs text-gray-500 hover:text-primary"><i class="bi bi-arrow-left"></i> Back to Portfolio</a>
    </div>
  </div>

</body>
</html>
